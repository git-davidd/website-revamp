<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./tailwindcss/output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Niramit:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- SECTIONS -->
    <section id="top" class="wlc-bg grid h-dvh w-dvw">
      <div class="w-fit place-self-center md:flex md:justify-center md:gap-10">
        <svg
          class="text-almost-white aspect-832/753 h-40 shrink-0 max-md:mb-10 max-md:-ml-1.75 md:h-50"
        >
          <use href="./assets/branding.svg#logo" />
        </svg>
        <div class="md:place-self-end">
          <h1
            class="text-almost-white font-title mb-6 text-4xl font-bold text-balance md:text-5xl"
          >
            Montage met <br />
            oog voor detail.
          </h1>
          <a
            class="underline-slide text-very-light-blue block w-fit border-2 p-2 pt-1 pr-3 pl-3 text-2xl font-semibold"
            href="#about"
            >Kennismaken
          </a>
        </div>
      </div>
      <!-- SCROLL ANIMATION AT THE BOTTOM (TODO) -->
    </section>

    <!-- navbar -->
    <nav class="bg-very-light-blue text-light-navy p-10 pt-8 text-lg">
      <h2 class="mb-3 text-2xl font-bold">Op deze pagina</h2>
      <div
        class="grid grid-flow-col grid-cols-[max-content_20px_max-content] grid-rows-[30px_8px_30px_8px]"
      >
        <a href="#services" class="mr-2 w-fit">Diensten</a>
        <div class="border-light-navy ml-5 h-2 w-px border-l"></div>
        <a href="#about" class="mr-2 w-fit">Over mij</a>
        <div
          class="border-light-navy w-20px ml-5 h-2.75 rounded-bl-sm border-b border-l"
        ></div>

        <div
          class="row-span-4 grid grid-cols-2 grid-rows-2 justify-self-center"
        >
          <div class="mt-3.75 h-8 w-2.5"></div>
          <div
            class="border-light-navy mt-3.75 -ml-px h-8 w-2.5 rounded-tl-sm border-t border-l"
          ></div>
          <div
            class="border-light-navy mt-2.25 h-8 w-2.5 rounded-br-sm border-r border-b"
          ></div>
          <div class="mt-3.75 h-8 w-2.5"></div>
        </div>

        <a href="#how" class="ml-2 w-fit">Hoe werk ik</a>
        <div class="border-light-navy ml-5 h-2 w-px border-l"></div>
        <a href="#contact" class="ml-2 w-fit">Contact</a>
      </div>
    </nav>

    <section id="services">
      <!-- services -->
    </section>
    <section id="about">
      <!-- about me -->
    </section>
    <section id="how">
      <!-- how working with me works -->
    </section>
    <section id="contact">
      <!-- contact, availability and working area -->
    </section>

    <footer id="bottom">
      <!-- copyright/tos/privacy policy (idk if i need them) -->
    </footer>

    <script src="./scripts.js"></script>
  </body>
</html>
